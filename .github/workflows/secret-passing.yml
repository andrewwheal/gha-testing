name: Testing Secret Passing

on:
    push:
        branches:
            - secret-passing
    workflow_dispatch:

jobs:
    get_secret:
        runs-on: ubuntu-latest
        outputs:
            my_first_secret: ${{ steps.get_secret.outputs.my_first_secret }}
        env:
            MFS: ${{ secrets.MY_FIRST_SECRET }}
        steps:
            - id: get_secret
              run: |
                  echo "first secret: $MFS ($(base64 <<<"${MFS}")) [${MFS:0:4}...${MFS:4}]"
                  echo "my_first_secret=super_secret_1" >> $GITHUB_OUTPUT
    call_reusable_workflow:
        needs: get_secret
        uses: ./.github/workflows/reusable.yml
        with:
            secret: ${{ needs.get_secret.outputs.my_first_secret }}
        secrets:
            secret: ${{ secrets.MY_SECOND_SECRET }}
