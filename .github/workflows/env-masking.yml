on:
    push

jobs:
    env-masking:
        runs-on: ubuntu-latest
        steps:
            - run: |
                echo "SECRET_VALUE=super_secret" >>$GITHUB_ENV
                echo "PUBLIC_VALUE=public_info" >>$GITHUB_ENV
            - run: |
                echo "This is a secret value: ${{ env.SECRET_VALUE }}"
                echo "This is a public value: ${{ env.PUBLIC_VALUE }}"
